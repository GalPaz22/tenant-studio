# Render Blueprint: Tenant Studio Web Service and site-crawl worker.
services:
  - type: web
    name: tenant-studio
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ALLOW_REMOTE
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: STUDIO_DASHBOARD_MONGODB_URI
        sync: false

  - type: worker
    name: semantix-site-crawler
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: node crawl-worker.mjs
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false
      - key: STUDIO_CRAWL_DB
        value: semantix_studio

